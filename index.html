<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Snake</title>
<style>
  :root { --cell: 24px; --grid: 20; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0f1117;
    color: #e6e6e6;
  }
  h1 { margin: 0; font-weight: 600; letter-spacing: 1px; }
  .hud { display: flex; gap: 24px; font-size: 18px; }
  .hud b { color: #5fd97b; }
  canvas {
    background: #161a23;
    border: 2px solid #2a2f3a;
    border-radius: 8px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
  .hint { font-size: 14px; color: #8a90a0; }
  .overlay {
    position: fixed; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    flex-direction: column; gap: 12px;
    background: rgba(15,17,23,.85);
    text-align: center;
  }
  .overlay.show { display: flex; }
  .overlay h2 { margin: 0; font-size: 32px; color: #ff6b6b; }
  button {
    padding: 10px 20px;
    font-size: 16px;
    border: none;
    border-radius: 6px;
    background: #5fd97b;
    color: #0f1117;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover { background: #6fe98b; }
</style>
</head>
<body>
  <h1>🐍 SNAKE</h1>
  <div class="hud">
    <div>Score: <b id="score">0</b></div>
    <div>Best: <b id="best">0</b></div>
  </div>
  <canvas id="board" width="480" height="480"></canvas>
  <div class="hint">Arrow keys or WASD to move · P to pause · R to restart</div>

  <div class="overlay" id="overlay">
    <h2 id="overlayTitle">Game Over</h2>
    <div>Score: <b id="finalScore">0</b></div>
    <button id="restartBtn">Play Again</button>
  </div>

<script>
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const GRID = 20;
const CELL = canvas.width / GRID;

const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');
const finalScore = document.getElementById('finalScore');

let snake, dir, nextDir, food, score, best, speed, loop, paused, dead;

best = Number(localStorage.getItem('snakeBest') || 0);
bestEl.textContent = best;

function reset() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = { x: 1, y: 0 };
  nextDir = { x: 1, y: 0 };
  score = 0;
  speed = 120;
  paused = false;
  dead = false;
  scoreEl.textContent = '0';
  overlay.classList.remove('show');
  placeFood();
  startLoop();
}

function startLoop() {
  clearInterval(loop);
  loop = setInterval(tick, speed);
}

function placeFood() {
  while (true) {
    const f = { x: (Math.random() * GRID) | 0, y: (Math.random() * GRID) | 0 };
    if (!snake.some(s => s.x === f.x && s.y === f.y)) { food = f; return; }
  }
}

function tick() {
  if (paused || dead) return;
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // wall collision
  if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID) return gameOver();
  // self collision
  if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      localStorage.setItem('snakeBest', best);
    }
    placeFood();
    // speed up slightly, capped
    if (speed > 60) { speed -= 3; startLoop(); }
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.fillStyle = '#161a23';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // food
  ctx.fillStyle = '#ff6b6b';
  roundRect(food.x * CELL, food.y * CELL, CELL, CELL, 6);

  // snake
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#7bf08b' : '#5fd97b';
    roundRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2, 5);
  });
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.fill();
}

function gameOver() {
  dead = true;
  clearInterval(loop);
  finalScore.textContent = score;
  overlay.classList.add('show');
}

document.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'arrowup' || k === 'w')    { if (dir.y !== 1)  nextDir = { x: 0, y: -1 }; }
  else if (k === 'arrowdown' || k === 's')  { if (dir.y !== -1) nextDir = { x: 0, y: 1 }; }
  else if (k === 'arrowleft' || k === 'a')  { if (dir.x !== 1)  nextDir = { x: -1, y: 0 }; }
  else if (k === 'arrowright' || k === 'd') { if (dir.x !== -1) nextDir = { x: 1, y: 0 }; }
  else if (k === 'p') { if (!dead) paused = !paused; }
  else if (k === 'r') { reset(); }
  if (['arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
});

document.getElementById('restartBtn').addEventListener('click', reset);

reset();
draw();
</script>
</body>
</html>
